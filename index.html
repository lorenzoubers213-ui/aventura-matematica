<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><title>Aventura Matemática</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#172033}header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;padding:22px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}header h1{margin:0 0 5px;font-size:clamp(24px,4vw,36px)}header p{margin:0;opacity:.9}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats span{background:#ffffff22;padding:10px 13px;border-radius:12px;font-weight:700}main{max-width:1050px;margin:auto;padding:24px}.screen{display:none}.screen.active{display:block}.hero,.card{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #17203312;margin-bottom:20px}.hero h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.grade,.level{border:0;border-radius:18px;padding:20px;text-align:left;background:white;box-shadow:0 7px 24px #17203314;cursor:pointer;min-height:125px;display:flex;flex-direction:column;gap:9px;transition:.15s}.grade:hover,.level:not(:disabled):hover{transform:translateY(-3px)}.grade b,.level b{font-size:19px}.grade span,.level span{color:#5b6578}.grade small{color:#2563eb;font-weight:700}.level.locked{opacity:.55;cursor:not-allowed}.back{border:0;background:#e8eefc;color:#1747a6;padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer;margin-bottom:14px}.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.quiz-head #progress{font-weight:800}.topic{color:#2563eb;font-weight:800}.card h2{font-size:clamp(24px,5vw,38px)}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answer,.primary{border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;cursor:pointer}.answer{background:#eef2f7}.answer:disabled{cursor:default}.answer.correct{background:#c8f7d5!important;border:2px solid #21a35b}.answer.wrong{background:#ffd2d2!important;border:2px solid #d33}.primary{background:#2563eb;color:white}.feedback{min-height:28px;font-weight:800}.correct-feedback{color:#16803c}.wrong-feedback{color:#c62828}.waiting{color:#667085}.center{text-align:center}footer{text-align:center;padding:25px 16px 35px}.footer-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.footer-nav button{border:0;background:white;padding:11px 15px;border-radius:12px;cursor:pointer}footer p{margin:0;font-size:14px;color:#344054}@media(max-width:600px){main{padding:14px}.answers{grid-template-columns:1fr}.card,.hero{padding:18px}header{padding:18px}}
</style></head><body>
<header><div><h1>🧮 Aventura Matemática</h1><p>Aprende, supera niveles y gana XP.</p></div><div class="stats"><span>⭐ <b id="xp">0</b> XP</span><span>🪙 <b id="coins">0</b></span><span>🔥 <b id="streak">0</b></span></div></header>
<main>
<section id="home" class="screen active"><div class="hero"><h2>Elige tu grado</h2><p>El nivel 1 de cada grado está disponible desde el inicio.</p></div><div id="grades" class="grid"></div></section>
<section id="levels" class="screen"><button class="back" id="backGrades">← Grados</button><div class="hero"><h2 id="gradeTitle"></h2><p>Completa cada nivel para desbloquear el siguiente.</p></div><div id="levelGrid" class="grid"></div></section>
<section id="quiz" class="screen"><div class="quiz-head"><button class="back" id="backLevels">← Niveles</button><span id="progress"></span></div><div class="card"><p id="topic" class="topic"></p><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" class="feedback"></p><button id="next" class="primary" hidden>Siguiente pregunta</button></div></section>
<section id="credits" class="screen"><div id="creditsContent" class="card center"></div></section></main>
<footer><div class="footer-nav"><button id="navHome">📚 Grados</button><button id="navStats">📊 Estadísticas</button><button id="navCredits">👥 Créditos</button></div><p><strong>App desarrollada por Ryan Salazar, Sara Mairena y Jostin Obregon</strong></p></footer>
<script>
(function(){'use strict';try{if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}catch(e){}
const GRADES=Array.from({length:11},(_,i)=>i+1),LEVELS=10,QUESTIONS=20,$=id=>document.getElementById(id);let state;try{state=JSON.parse(localStorage.getItem('aventuraMatematica')||'{}')}catch(e){state={}}state.xp||=0;state.coins||=0;state.streak||=0;state.completed||={};state.correct||=0;state.total||=0;let grade=1,level=1,qIndex=0,score=0,current=null;
const save=()=>{localStorage.setItem('aventuraMatematica',JSON.stringify(state));updateStats()},updateStats=()=>{$('xp').textContent=state.xp;$('coins').textContent=state.coins;$('streak').textContent=state.streak},show=id=>{document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)},done=(g,l)=>!!state.completed[g+'-'+l],open=l=>l===1||done(grade,l-1);
function renderGrades(){$('grades').innerHTML=GRADES.map(g=>`<button type="button" class="grade"><b>📚 ${g}° grado</b><span>10 niveles · 20 preguntas</span><small>▶ Entrar al grado</small></button>`).join('');document.querySelectorAll('.grade').forEach((b,i)=>b.onclick=()=>{grade=i+1;renderLevels();show('levels')})}
function renderLevels(){$('gradeTitle').textContent=`${grade}° grado`;$('levelGrid').innerHTML=Array.from({length:10},(_,i)=>{let l=i+1,d=done(grade,l),o=open(l);return `<button type="button" class="level ${o?'':'locked'}" data-level="${l}" ${o&&!d?'':'disabled'}><b>${d?'✅ ':o?'▶️ ':'🔒 '}Nivel ${l}</b><span>${d?'Completado':o?'20 preguntas · Jugar':'Completa el nivel anterior'}</span></button>`}).join('');document.querySelectorAll('.level:not(:disabled)').forEach(b=>b.onclick=()=>startLevel(Number(b.dataset.level)))}
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function mk(q,a,t){let ans=Number.isInteger(a)?String(a):String(Math.round(a*100)/100),s=new Set([ans]);while(s.size<4){let d=rand(-Math.max(3,Math.ceil(Math.abs(a)*.3)),Math.max(3,Math.ceil(Math.abs(a)*.3)));s.add(String(Math.round((Number(a)+d)*100)/100))}return{q,a:ans,opts:[...s].sort(()=>Math.random()-.5),t}}
function make(g){let a=rand(2,12),b=rand(2,12),t=rand(0,2);if(g<=2){a=rand(1,20);b=rand(1,20);return Math.random()<.55?mk(`${a} + ${b} = ?`,a+b,'Suma'):mk(`${Math.max(a,b)} - ${Math.min(a,b)} = ?`,Math.abs(a-b),'Resta')}if(g<=4){return t===0?mk(`${a} × ${b} = ?`,a*b,'Multiplicación'):t===1?mk(`${a*b} ÷ ${b} = ?`,a,'División'):mk(`¿Cuál es ${a}²?`,a*a,'Potencias')}if(g<=6){a=rand(10,99);b=rand(2,30);return t===0?mk(`${a} + ${b} = ?`,a+b,'Números naturales'):t===1?mk(`${a} - ${b} = ?`,a-b,'Números naturales'):mk(`¿Cuál es el 10% de ${a*10}?`,a,'Porcentajes')}if(g<=8)return t===0?mk(`Resuelve: ${a}x = ${a*b}`,b,'Ecuaciones'):t===1?mk(`Simplifica: ${a}/${b} + ${a}/${b}`,2*a/b,'Fracciones'):mk(`Si x = ${a}, ¿cuánto vale 2x + ${b}?`,2*a+b,'Álgebra');if(g<=10)return t===0?mk(`Resuelve: x + ${a} = ${a+b}`,b,'Ecuaciones lineales'):t===1?mk(`¿Cuánto es ${a}² + ${b}²?`,a*a+b*b,'Álgebra'):mk(`Pendiente entre (0,0) y (${a},${b}) = ?`,b/a,'Geometría analítica');return t===0?mk(`Derivada de x² en x=${a}`,2*a,'Cálculo'):t===1?mk(`Si 2x + ${a} = ${b+a}, x = ?`,b,'Álgebra avanzada'):mk('Probabilidad de sacar un número par en un dado justo',.5,'Probabilidad')}
function nextQuestion(){if(qIndex>=20)return finish();current=make(grade);$('progress').textContent=`Pregunta ${qIndex+1} de 20`;$('topic').textContent=current.t;$('question').textContent=current.q;$('feedback').textContent='Elige una respuesta';$('feedback').className='feedback waiting';$('next').hidden=true;$('answers').innerHTML='';current.opts.forEach(v=>{let b=document.createElement('button');b.className='answer';b.type='button';b.textContent=v;b.onclick=()=>answer(b,v);$('answers').appendChild(b)})}
function answer(btn,val){document.querySelectorAll('.answer').forEach(x=>x.disabled=true);state.total++;if(String(val)===current.a){score++;state.correct++;state.xp+=10;state.coins+=2;state.streak++;btn.classList.add('correct');$('feedback').className='feedback correct-feedback';$('feedback').textContent='✅ ¡Correcto! +10 XP y +2 monedas'}else{state.streak=0;btn.classList.add('wrong');document.querySelectorAll('.answer').forEach(x=>{if(x.textContent===current.a)x.classList.add('correct')});$('feedback').className='feedback wrong-feedback';$('feedback').textContent=`❌ Incorrecto. La respuesta correcta es ${current.a}.`}save();$('next').hidden=false;$('next').textContent=qIndex===19?'🏆 Terminar nivel':'➡️ Siguiente pregunta'}
function startLevel(l){level=l;qIndex=0;score=0;show('quiz');nextQuestion()}function finish(){state.completed[grade+'-'+level]=true;state.xp+=50;state.coins+=10;save();alert(`🏆 ¡Nivel ${level} completado!\nAciertos: ${score}/20\n+50 XP y +10 monedas`);renderLevels();show('levels')}function stats(){show('credits');$('creditsContent').innerHTML=`<h2>📊 Estadísticas</h2><p>⭐ XP: <b>${state.xp}</b></p><p>🪙 Monedas: <b>${state.coins}</b></p><p>🔥 Racha: <b>${state.streak}</b></p><p>✅ Aciertos: <b>${state.correct}/${state.total}</b></p>`}function credits(){show('credits');$('creditsContent').innerHTML='<h2>🏆 ¡Sigue aprendiendo!</h2><p>Completa niveles para ganar XP y monedas.</p>'}
$('next').onclick=()=>{qIndex++;nextQuestion()};$('backGrades').onclick=()=>show('home');$('backLevels').onclick=()=>{renderLevels();show('levels')};$('navHome').onclick=()=>{renderGrades();show('home')};$('navStats').onclick=stats;$('navCredits').onclick=credits;updateStats();renderGrades();
})();
</script></body></html>
