name: Fix interaction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace app script with stable version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          script=r'''<script>(function(){'use strict';
          var S={xp:0,coins:0,streak:0,completed:{},bosses:{},name:'',correct:0,total:0,materials:0,world:[],questionHistory:[]};
          try{var saved=JSON.parse(localStorage.getItem('aventuraMatematica')||'null');if(saved&&typeof saved==='object')Object.keys(S).forEach(function(k){if(saved[k]!==undefined)S[k]=saved[k]})}catch(e){}
          S.completed=S.completed||{};S.bosses=S.bosses||{};S.world=Array.isArray(S.world)?S.world:[];S.questionHistory=Array.isArray(S.questionHistory)?S.questionHistory:[];S.materials=Number(S.materials)||0;
          var grade=1,level=1,pos=0,score=0,isChallenge=false,qs=[],timer=null,time=60,miniRound=0,miniScore=0,bossHp=100,bossQ=0;
          var quickGrade=1,quickDiff=0,quickPos=0,quickScore=0,quickQs=[];var mentalGrade=1,mentalDiff=0,mentalSeq=[],mentalAnswer=0,mentalTimer=null;
          var A=[['🐰','Conejito','¡Vamos!'],['🐱','Gatita','¡Piensa con calma!'],['🐶','Perrito','¡Tú puedes!'],['🦊','Zorrito','¡Usa tu ingenio!'],['🐼','Panda','¡Excelente!'],['🐨','Koala','¡Sigue practicando!'],['🦁','León','¡Demuestra tu poder!'],['🐯','Tigre','¡Concéntrate!'],['🐸','Rana','¡Salta a la respuesta!'],['🐵','Monito','¡Usa tu lógica!'],['🦄','Unicornio','¡Haz magia!']];
          var B=['👹 Rey de los Números','🐲 Dragón de las Operaciones','🤖 Robot Multiplicador','🧙 Mago de las Fracciones','👑 Guardián de los Decimales','🦹 Señor de los Porcentajes','👾 Monstruo del Álgebra','🐉 Dragón de las Ecuaciones','🧟 Guardián de las Potencias','🧙‍♂️ Maestro de las Funciones','🚀 Jefe Matemático Supremo'];
          var GI=['Números y operaciones básicas','Suma, resta y problemas','Multiplicación y división','Fracciones, medidas y geometría','Decimales y proporcionalidad','Porcentajes, múltiplos y expresiones','Enteros y ecuaciones','Álgebra y geometría','Potencias y funciones','Funciones, gráficas y probabilidad','Funciones, probabilidad y cálculo'];
          var DIFF=[['🌱 Inicial','Conceptos esenciales'],['⚡ Intermedia','Práctica guiada'],['🔥 Avanzada','Reto maestro']];
          function $(id){return document.getElementById(id)}function save(){try{localStorage.setItem('aventuraMatematica',JSON.stringify(S))}catch(e){}update()}function update(){if($('xp'))$('xp').textContent=S.xp;if($('coins'))$('coins').textContent=S.coins;if($('streak'))$('streak').textContent=S.streak;if($('pXp'))$('pXp').textContent=S.xp;if($('pCoins'))$('pCoins').textContent=S.coins;if($('pStreak'))$('pStreak').textContent=S.streak;if($('pLevels'))$('pLevels').textContent=Object.keys(S.completed).length;if($('materials'))$('materials').textContent=S.materials}function show(id){document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('active')});var el=$(id);if(el)el.classList.add('active');window.scrollTo(0,0)}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function gcd(a,b){while(b){var t=a%b;a=b;b=t}return Math.abs(a)}function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}function done(g,l){return !!S.completed[g+'-'+l]}function unlocked(l){return l===1||done(grade,l-1)}
          function make(text,ans){ans=Number(ans);if(!Number.isFinite(ans))ans=0;var o=[ans],span=Math.max(2,Math.ceil(Math.abs(ans)*.18));while(o.length<4){var n=Number((ans+rand(-span,span)).toFixed(2));if(o.indexOf(n)<0)o.push(n)}o.sort(function(){return Math.random()-.5});return{text:text,answer:String(ans),options:o.map(String)}}
          function qKey(q){return String(q.text)+'|'+String(q.answer)}function unique(generator,count){var out=[],tries=0;while(out.length<count&&tries<count*1000){var q=generator(),k=qKey(q);if(S.questionHistory.indexOf(k)<0){S.questionHistory.push(k);out.push(q)}tries++}return out}
          function makeQ(g,d){var a=rand(2,12+g+d*5),b=rand(2,10+g+d*4),c=rand(2,9+g),p=rand(2,6),q=rand(2,6);if(g===1)return make(a+' + '+b+' = ?',a+b);if(g===2){var x=rand(b+1,55+d*10);return d<3?make(x+' − '+b+' = ?',x-b):make('¿Qué número falta? '+b+' + ? = '+x,x-b)}if(g===3)return d<=2?make(a+' × '+b+' = ?',a*b):make((a*b)+' ÷ '+a+' = ?',b);if(g===4){if(d===1)return make(a+' × '+b+' = ?',a*b);if(d===2)return make('Perímetro de cuadrado de lado '+a+' = ?',4*a);if(d===3)return make('Área de rectángulo '+a+' × '+b+' = ?',a*b);var den=rand(2,8);return make('¿Qué fracción de '+(den*c)+' es '+c+'?',1/den)}if(g===5){if(d===1){var da=rand(1,9),db=rand(1,9);return make((da/10).toFixed(1)+' + '+(db/10).toFixed(1)+' = ?',Number(((da+db)/10).toFixed(1)))}if(d===2){var pct=[10,20,25,50][rand(0,3)],base=rand(4,25)*10;return make(pct+'% de '+base+' = ?',base*pct/100)}if(d===3)return make('3 cuadernos cuestan '+a*3+'. 5 cuestan ?',a*5);return make('Área de rectángulo '+a+' × '+b+' = ?',a*b)}if(g===6){if(d===1){var pct2=[10,20,25,50][rand(0,3)],base2=rand(4,25)*10;return make(pct2+'% de '+base2+' = ?',base2*pct2/100)}if(d===2)return make('MCM de '+a+' y '+b+' = ?',lcm(a,b));if(d===3)return make((p+1)+'x = '+(p+1)*b+' → x = ?',b);return make((p+1)+'x + '+a+' = '+(a+(p+1)*b)+' → x = ?',b)}if(g===7){if(d===1)return make('−'+a+' + '+b+' = ?',b-a);if(d===2)return make('2x + '+a+' = '+(a+b*2)+' → x = ?',b);if(d===3)return make('3(x − '+a+') = '+b*3+' → x = ?',a+b);return make('−2x + '+a+' = '+b+' → x = ?',(a-b)/2)}if(g===8){if(d===1)return make('2(x + '+a+') = '+b*2+' → x = ?',b-a);if(d===2)return make('x/2 + '+a+' = '+(a+b)+' → x = ?',2*b);if(d===3)return make('x² − '+a*a+' = 0. x positivo = ?',a);return make('Área de triángulo base '+a+' y altura '+b+' = ?',a*b/2)}if(g===9){if(d===1)return make('2^'+p+' × 2^'+q+' = ?',Math.pow(2,p+q));if(d===2)return make('√'+a*a+' = ?',a);if(d===3)return make('3x − '+a+' = '+b+' → x = ?',(a+b)/3);return make('f(x)=x²+'+a+'. f('+b+') = ?',b*b+a)}if(g===10){if(d===1)return make('Pendiente entre (0,0) y ('+a+','+b+') = ?',b/a);if(d===2)return make('x² − '+(a+b)+'x + '+a*b+' = 0. x menor = ?',Math.min(a,b));if(d===3){var sides=rand(4,10),fav=rand(1,sides-1);return make('Probabilidad de '+fav+' resultados favorables entre '+sides+' = ?',fav/sides)}return make('Distancia entre (0,0) y ('+a+','+b+') = ?',Math.sqrt(a*a+b*b))}if(d===1)return make('Derivada de x² en x='+a+' = ?',2*a);if(d===2)return make('∫ 2x dx evaluada en x='+a+' = ?',a*a);if(d===3)return make('Límite de (x²−'+a*a+')/(x−'+a+') en x='+a+' = ?',2*a);var den3=rand(2,6),fav3=rand(1,den3-1);return make('Probabilidad de '+fav3+' casos favorables entre '+den3+' = ?',fav3/den3)}
          function renderGrades(){var h='';for(var i=1;i<=11;i++)h+='<button class="grade" data-grade="'+i+'"><b>📚 '+i+'° grado</b><span>'+GI[i-1]+' · 10 niveles · jefe</span></button>';$('grades').innerHTML=h;document.querySelectorAll('#grades .grade').forEach(function(b){b.onclick=function(){grade=+b.dataset.grade;renderLevels();show('levels')}})}
          function renderLevels(){var h='';for(var i=1;i<=10;i++){var d=done(grade,i),o=unlocked(i);h+='<button class="level" data-level="'+i+'" '+(o?'':'disabled')+'><b>'+(d?'✅ ':o?'▶️ ':'🔒 ')+'Nivel '+i+'</b><span>'+(d?'Completado':o?'20 preguntas':'Completa el nivel anterior')+'</span></button>'}$('levelGrid').innerHTML=h;$('gradeTitle').textContent='Grado '+grade+'°';$('gradeInfo').textContent=GI[grade-1];document.querySelectorAll('#levelGrid .level:not(:disabled)').forEach(function(b){b.onclick=function(){startLevel(+b.dataset.level)}});var ready=done(grade,10);$('bossPreview').innerHTML='<h2>'+B[grade-1]+'</h2><p>'+(ready?'¡Jefe desbloqueado!':'Completa los 10 niveles para desbloquearlo.')+'</p><button id="bossOpen" class="primary" '+(ready?'':'disabled')+'>'+(ready?'⚔️ Enfrentar jefe':'🔒 Jefe bloqueado')+'</button>';if(ready)$('bossOpen').onclick=startBoss}
          function renderChallenges(){var h='';for(var i=1;i<=11;i++)h+='<button class="challenge" data-c="'+i+'"><b>⚡ Desafío '+i+'°</b><span>10 preguntas · dificultad adaptada</span></button>';$('challengeGrid').innerHTML=h;document.querySelectorAll('#challengeGrid .challenge').forEach(function(b){b.onclick=function(){startChallenge(+b.dataset.c)}})}function renderGames(){var h='';for(var i=1;i<=11;i++)h+='<button class="mini" data-g="'+i+'"><b>🎮 Minijuego '+i+'°</b><span>5 rondas · dificultad adaptada</span></button>';$('gamesGrid').innerHTML=h;document.querySelectorAll('#gamesGrid .mini').forEach(function(b){b.onclick=function(){startMini(+b.dataset.g)}})}
          function renderQuestion(){if(pos>=qs.length){isChallenge?finishChallenge():finishLevel();return}var q=qs[pos],a=A[grade-1];$('animal').textContent=a[0];$('animalName').textContent=a[1];$('animalMsg').textContent=a[2];$('progress').textContent=(isChallenge?'Desafío '+grade+'°':'Nivel '+level)+' · Pregunta '+(pos+1)+' de '+qs.length;$('question').textContent=q.text;$('feedback').textContent='';$('next').style.display='none';$('answers').innerHTML=q.options.map(function(v){return '<button class="answer" data-answer="'+v+'">'+v+'</button>'}).join('');document.querySelectorAll('#answers .answer').forEach(function(b){b.onclick=function(){answer(b,b.dataset.answer)}})}function answer(btn,val){document.querySelectorAll('#answers .answer').forEach(function(x){x.disabled=true});S.total++;var ok=String(val)===String(qs[pos].answer);if(ok){score++;S.correct++;S.xp+=isChallenge?15:10;S.coins+=isChallenge?3:2;S.streak++;S.materials++;btn.classList.add('correct');$('feedback').textContent='✅ ¡Correcto!'}else{S.streak=0;btn.classList.add('wrong');$('feedback').textContent='❌ Incorrecto. Era '+qs[pos].answer;document.querySelectorAll('#answers .answer').forEach(function(x){if(x.dataset.answer===qs[pos].answer)x.classList.add('correct')})}save();$('next').style.display='block';$('next').textContent=pos===qs.length-1?'🏁 Ver resultado':'➡️ Siguiente'}
          function startLevel(l){clearInterval(timer);level=l;isChallenge=false;pos=0;score=0;var dBase=Math.min(4,1+Math.floor((l-1)/2));qs=unique(function(){return makeQ(grade,dBase)},20);$('timer').style.display='none';show('quiz');renderQuestion()}function startChallenge(g){clearInterval(timer);grade=g;isChallenge=true;pos=0;score=0;var dBase=Math.min(4,1+Math.floor((g-1)/4));qs=unique(function(){return makeQ(g,dBase)},10);time=60;show('quiz');$('timer').style.display='block';$('timer').textContent='⏱️ 60 segundos';timer=setInterval(function(){time--;if($('timer'))$('timer').textContent='⏱️ '+time+' segundos';if(time<=0){clearInterval(timer);finishChallenge()}},1000);renderQuestion()}function finishLevel(){if(done(grade,level))return celebrate('🎉 Nivel ya completado','Puntaje: '+score+'/20.','levels');S.completed[grade+'-'+level]=true;S.xp+=50+grade*5;S.coins+=10+grade;save();celebrate('🎉 ¡Nivel completado!','Conseguiste '+score+'/20.','levels')}function finishChallenge(){clearInterval(timer);$('timer').style.display='none';S.xp+=score>=7?100+grade*5:30+grade*2;S.coins+=20+grade;save();celebrate('⚡ ¡Desafío terminado!','Lograste '+score+'/10.','challenge')}
          function startMini(g){grade=g;miniRound=0;miniScore=0;show('miniGame');$('miniTitle').textContent='🎮 Minijuego · '+g+'° grado';miniQuestion()}function miniQuestion(){if(miniRound>=5){S.xp+=miniScore*(10+grade);S.coins+=miniScore*2;save();return celebrate('🎮 ¡Minijuego terminado!','Aciertos: '+miniScore+'/5.','games')}var d=Math.min(4,1+miniRound+Math.floor((grade-1)/3)),q=unique(function(){return makeQ(grade,d)},1)[0];$('miniRound').textContent='Ronda '+(miniRound+1)+' de 5';$('miniBig').textContent=q.text;$('miniFeedback').textContent='';$('miniOptions').innerHTML=q.options.map(function(v){return '<button class="answer miniOpt" data-answer="'+v+'">'+v+'</button>'}).join('');document.querySelectorAll('.miniOpt').forEach(function(b){b.onclick=function(){var ok=String(b.dataset.answer)===q.answer;document.querySelectorAll('.miniOpt').forEach(function(x){x.disabled=true});if(ok){miniScore++;S.xp+=8;S.coins++;$('miniFeedback').textContent='✅ Correcto'}else $('miniFeedback').textContent='❌ Era '+q.answer;miniRound++;setTimeout(miniQuestion,300)}})}
          function startBoss(){if(!done(grade,10))return;bossHp=100;bossQ=0;show('boss');bossNext()}function bossNext(){if(bossHp<=0){S.bosses[grade]=true;S.xp+=200+grade*10;S.coins+=50+grade*3;save();return celebrate('👑 ¡Jefe derrotado!','Has conquistado el '+grade+'° grado.','levels')}var q=unique(function(){return makeQ(grade,Math.min(4,1+Math.floor(bossQ/2)+Math.floor((grade-1)/3)))},1)[0];$('bossIcon').textContent=B[grade-1].split(' ')[0];$('bossName').textContent=B[grade-1].replace(/^\S+ /,'');$('bossHpText').textContent=bossHp;$('bossBar').style.width=bossHp+'%';$('bossQuestion').textContent=q.text;$('bossFeedback').textContent='';$('bossAnswers').innerHTML=q.options.map(function(v){return '<button class="answer bossOpt" data-answer="'+v+'">'+v+'</button>'}).join('');document.querySelectorAll('.bossOpt').forEach(function(b){b.onclick=function(){var ok=String(b.dataset.answer)===q.answer;document.querySelectorAll('.bossOpt').forEach(function(x){x.disabled=true});if(ok){bossHp=Math.max(0,bossHp-20);$('bossFeedback').textContent='⚔️ ¡Golpe correcto!'}else{$('bossFeedback').textContent='💥 Era '+q.answer;bossHp=Math.min(100,bossHp+5)}bossQ++;save();setTimeout(bossNext,400)}})}
          function puzzleQuestion(){var g=rand(1,11),a=rand(2,20+g),b=rand(1,8+g),t=rand(1,5),ans,text;if(t===1){ans=a+2*b;text=a+', '+(a+b)+', '+(a+2*b)+', ?'}else if(t===2){ans=a*2;text=a+', '+a*2+', '+a*4+', ?'}else if(t===3){ans=a-b*2;text=a+', '+(a-b)+', '+(a-2*b)+', ?'}else if(t===4){ans=a*b;text='Rectángulo '+a+' × '+b+'. Área = ?'}else{ans=a+b;text='A='+a+', B='+b+'. A+B = ?'}return make(text,ans)}var currentPuzzle=null;function renderPuzzle(){currentPuzzle=unique(puzzleQuestion,1)[0];$('puzzleQuestion').textContent=currentPuzzle.text;$('puzzleFeedback').textContent='';$('puzzleOptions').innerHTML=currentPuzzle.options.map(function(v){return '<button class="answer puzzleOpt" data-answer="'+v+'">'+v+'</button>'}).join('');document.querySelectorAll('.puzzleOpt').forEach(function(b){b.onclick=function(){var ok=String(b.dataset.answer)===currentPuzzle.answer;document.querySelectorAll('.puzzleOpt').forEach(function(x){x.disabled=true});$('puzzleFeedback').textContent=ok?'✅ ¡Correcto!':'❌ La respuesta era '+currentPuzzle.answer;if(ok){S.xp+=8;S.materials++}save()}})}
          function labUpdate(){var parts=+$('fracParts').value,on=Math.min(parts,+$('fracOn').value);$('fracOn').max=parts;$('fracPartsText').textContent=parts;$('fracOnText').textContent=on;var h='';for(var i=0;i<parts;i++)h+='<span class="frac-piece '+(i<on?'on':'')+'"></span>';$('fractionVisual').innerHTML='<div class="fraction">'+h+'</div>';$('fractionText').textContent='Fracción: '+on+'/'+parts+' = '+(on/parts).toFixed(2);var base=+$('baseRange').value,height=+$('heightRange').value;$('baseText').textContent=base;$('heightText').textContent=height;$('areaVisual').innerHTML='📐 Área = '+base*height;var x=+$('xRange').value,m=+$('mRange').value;$('xText').textContent=x;$('mText').textContent=m;$('equationVisual').innerHTML='🔢 '+m+'x + 2 = '+(m*x+2)}
          var exploreCat='lab',exploreGrade=1,exploreClass=0,exploreDiff=0,lessonPos=0,lessonScore=0,lessonQs=[];var EDATA={lab:{title:'🧪 Laboratorio Matemático',info:'Experimenta con conceptos adaptados a cada grado.',icon:'🧪',classes:['Números y operaciones','Medidas y geometría','Patrones y relaciones','Problemas y estrategias']},puzzle:{title:'🧩 Rompecabezas',info:'Retos cortos de lógica y pensamiento matemático.',icon:'🧩',classes:['Patrones y series','Lógica numérica','Geometría mental','Probabilidad y datos']},build:{title:'🏗️ Construye tu mundo',info:'Construye mientras aplicas matemática real.',icon:'🏗️',classes:['Diseño y medidas','Geometría de construcciones','Coordenadas y mapas','Proyecto matemático']}};
          function exploreGrades(cat){exploreCat=cat;var d=EDATA[cat];$('exploreGradesTitle').textContent=d.icon+' '+d.title;$('exploreGradesInfo').textContent=d.info;$('exploreGradeGrid').innerHTML='';for(var g=1;g<=11;g++){var b=document.createElement('button');b.className='grade';b.innerHTML='<b>'+d.icon+' '+g+'° grado</b><span>'+GI[g-1]+' · 4 clases</span>';b.onclick=function(){exploreGrade=Array.prototype.indexOf.call(document.querySelectorAll('#exploreGradeGrid .grade'),this)+1;renderExploreClasses()};$('exploreGradeGrid').appendChild(b)}show('exploreGrades')}
          function renderExploreClasses(){var d=EDATA[exploreCat];$('exploreClassesTitle').textContent=d.icon+' '+exploreGrade+'° · '+d.title;$('exploreClassesInfo').textContent=GI[exploreGrade-1];$('exploreClassGrid').innerHTML='';d.classes.forEach(function(c,i){var b=document.createElement('button');b.className='class-card';b.innerHTML='<b>'+d.icon+' Clase '+(i+1)+': '+c+'</b><span>3 dificultades · 5 retos</span>';b.onclick=function(){exploreClass=i;renderExploreDifficulty()};$('exploreClassGrid').appendChild(b)});show('exploreClasses')}
          function renderExploreDifficulty(){$('exploreDifficultyTitle').textContent=EDATA[exploreCat].icon+' '+exploreGrade+'° · '+EDATA[exploreCat].classes[exploreClass];$('exploreDifficultyInfo').textContent='Elige una dificultad';$('exploreDifficultyGrid').innerHTML='';DIFF.forEach(function(d,i){var b=document.createElement('button');b.className='difficulty-card';b.innerHTML='<b>'+d[0]+'</b><span>'+d[1]+'</span><span>5 retos únicos</span>';b.onclick=function(){exploreDiff=i;startExploreLesson()};$('exploreDifficultyGrid').appendChild(b)});show('exploreDifficulty')}
          function exploreQ(){var g=exploreGrade,d=exploreDiff+1,a=rand(2,8+g+d*3),b=rand(2,9+g+d*2),ans,text;if(exploreCat==='lab'){if(exploreClass===0){ans=g<=2?a+b:a*b;text='Calcula: '+a+(g<=2?' + ':' × ')+b+' = ?'}else if(exploreClass===1){ans=a*b;text='Área de rectángulo '+a+' × '+b+' = ?'}else if(exploreClass===2){ans=a+3*b;text='Patrón: '+a+', '+(a+b)+', '+(a+2*b)+', ?'}else{ans=a*b+g;text='Hay '+a+' grupos de '+b+' y '+g+' extra. ¿Total?'}}else if(exploreCat==='puzzle'){if(exploreClass===0){ans=a+3*b;text='Serie: '+a+', '+(a+b)+', '+(a+2*b)+', ?'}else if(exploreClass===1){ans=Math.max(a,b)+g;text='Mayor entre '+a+' y '+b+' + '+g+' = ?'}else if(exploreClass===2){ans=a*b;text='Área de '+a+' × '+b+' = ?'}else{var fav=rand(1,4),tot=fav+rand(1,5);ans=fav/tot;text='Probabilidad de '+fav+' favorables entre '+tot+' = ?'}}else{if(exploreClass===0){ans=a+b;text='Base '+a+' + pieza '+b+' = ?'}else if(exploreClass===1){ans=2*(a+b);text='Perímetro de '+a+' × '+b+' = ?'}else if(exploreClass===2){ans=a+b;text='Desde x='+a+' avanzas '+b+'. x final = ?'}else{ans=a*b+g;text='Proyecto: '+a+' × '+b+' + '+g+' = ?'}}return make(text,ans)}function startExploreLesson(){lessonPos=0;lessonScore=0;lessonQs=unique(exploreQ,5);$('exploreLessonTitle').textContent=EDATA[exploreCat].icon+' '+exploreGrade+'° · '+EDATA[exploreCat].classes[exploreClass];$('exploreLessonInfo').textContent=DIFF[exploreDiff][0]+' · 5 retos';show('exploreLesson');renderExploreQuestion()}function renderExploreQuestion(){if(lessonPos>=lessonQs.length){finishExploreLesson();return}var q=lessonQs[lessonPos];$('lessonQuestion').textContent=q.text;$('lessonMeter').style.width=(lessonPos/lessonQs.length*100)+'%';$('lessonFeedback').textContent='';$('lessonNext').style.display='none';$('lessonOptions').innerHTML=q.options.map(function(v){return '<button class="lesson-option" data-answer="'+v+'">'+v+'</button>'}).join('');document.querySelectorAll('.lesson-option').forEach(function(b){b.onclick=function(){document.querySelectorAll('.lesson-option').forEach(function(x){x.disabled=true});if(String(b.dataset.answer)===q.answer){lessonScore++;S.xp+=5;S.materials++;$('lessonFeedback').textContent='✅ Correcto'}else $('lessonFeedback').textContent='❌ Era '+q.answer;save();$('lessonNext').style.display='block';$('lessonNext').textContent=lessonPos===lessonQs.length-1?'🏁 Resultado':'➡️ Siguiente'}})}function finishExploreLesson(){S.xp+=lessonScore*5;S.coins+=lessonScore;save();celebrate('✨ Clase completada','Aciertos: '+lessonScore+'/5.','exploreDifficulty')}
