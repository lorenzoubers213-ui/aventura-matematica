name: Patch Aventura Matematica
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply app patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'data-patch="v2-unique-quick-mental"' in s:
              raise SystemExit(0)

          s=s.replace('<style>*{box-sizing:border-box}', '<style>[data-patch="v2-unique-quick-mental"]{display:none}*{box-sizing:border-box}', 1)

          old='<button class="category-card" data-category="build"><span class="big">🏗️</span><b>Construye tu mundo</b><span>Diseña usando geometría, medidas y coordenadas.</span></button>'
          new=old+'<button class="category-card" data-category="quick"><span class="big">⚡</span><b>Retos rápidos</b><span>Retos por grado y dificultad, sin repetir preguntas.</span></button><button class="category-card" data-category="mental"><span class="big">🧠</span><b>Cálculo mental</b><span>Memoriza una serie que aparece rápido y calcula su resultado.</span></button>'
          s=s.replace(old,new,1)

          marker='<section id="laboratory" class="screen">'
          screens='''<section id="quickChallenges" class="screen"><button id="backQuick" class="back">← Explorar</button><div class="hero explore-head"><h2>⚡ Retos rápidos</h2><p>Elige grado y dificultad. Cada reto usa preguntas nuevas y evita repeticiones.</p></div><div id="quickGradeGrid" class="grid"></div></section><section id="quickGame" class="screen"><button id="backQuickGame" class="back">← Grados</button><div class="hero explore-head"><h2 id="quickTitle"></h2><p id="quickInfo"></p><div class="meter"><div id="quickMeter" style="width:0%"></div></div></div><div class="card"><div id="quickProgress" class="progress"></div><div id="quickQuestion" class="question"></div><div id="quickOptions" class="answers"></div><p id="quickFeedback" class="feedback"></p><button id="quickNext" class="primary" style="display:none">Siguiente</button></div></section><section id="mental" class="screen"><button id="backMental" class="back">← Explorar</button><div class="hero explore-head"><h2>🧠 Cálculo mental</h2><p>Los números aparecen rápidamente. Memorízalos y luego calcula el resultado.</p></div><div id="mentalGradeGrid" class="grid"></div></section><section id="mentalGame" class="screen"><button id="backMentalGame" class="back">← Grados</button><div class="hero explore-head"><h2 id="mentalTitle"></h2><p id="mentalInfo"></p></div><div class="card mini-board"><div id="mentalStatus" class="progress"></div><div id="mentalSequence" class="mini-big"></div><div id="mentalQuestion" class="question" style="display:none"></div><input id="mentalAnswer" class="input" type="number" step="any" placeholder="Escribe el resultado" style="display:none"><button id="mentalStart" class="primary">▶️ Iniciar serie</button><button id="mentalCheck" class="primary" style="display:none">Comprobar</button><p id="mentalFeedback" class="feedback"></p></div></section>'''
          s=s.replace(marker,screens+marker,1)

          s=s.replace("var EDATA={lab:", "var EDATA={quick:{title:'⚡ Retos rápidos',info:'Retos breves adaptados a cada grado y dificultad.',icon:'⚡',classes:[['Cálculo veloz','Operaciones rápidas adaptadas al grado.'],['Comparaciones','Compara cantidades, expresiones y resultados.'],['Patrones exprés','Encuentra reglas y términos faltantes.'],['Problemas relámpago','Resuelve situaciones cortas con estrategia.']]},mental:{title:'🧠 Cálculo mental',info:'Series numéricas para memorizar y calcular mentalmente.',icon:'🧠',classes:[['Sumas relámpago','Memoriza una serie y calcula la suma.'],['Operaciones mixtas','Memoriza valores y combina operaciones.'],['Series numéricas','Recuerda la secuencia y encuentra el resultado.'],['Reto de memoria','Series más largas y rápidas según la dificultad.']]},lab:",1)

          old_make=re.compile(r"function makeQ\(g,d\)\{.*?\}function renderGrades\(\)",re.S)
          new_make=r'''function makeQ(g,d){var a=rand(2,12+g+d*4),b=rand(2,10+g+d*3),c=rand(2,9+g),p=rand(2,6),q=rand(2,6),x,y;d=Math.max(1,Math.min(4,d));if(g===1){x=rand(2,20+d*8);y=rand(1,12+d*3);return make(x+' + '+y+' = ?',x+y)}if(g===2){x=rand(12,45+d*12);y=rand(1,Math.min(x-1,20+d*4));return d<3?make(x+' − '+y+' = ?',x-y):make('¿Qué número falta? '+y+' + ? = '+x,x-y)}if(g===3)return d<=2?make(a+' × '+b+' = ?',a*b):make((a*b)+' ÷ '+a+' = ?',b);if(g===4){if(d===1)return make(a+' × '+b+' = ?',a*b);if(d===2)return make('Perímetro de cuadrado de lado '+a+' = ?',4*a);if(d===3)return make('Área de rectángulo '+a+' × '+b+' = ?',a*b);var den=rand(2,8),num=1;return make('¿Qué fracción de '+(den*c)+' es '+c+'?',1/den)}if(g===5){if(d===1){var da=rand(1,9),db=rand(1,9);return make((da/10).toFixed(1)+' + '+(db/10).toFixed(1)+' = ?',Number(((da+db)/10).toFixed(1)))}if(d===2){var pct=[10,20,25,50][rand(0,3)];return make(pct+'% de '+(a*4)+' = ?',a*4*pct/100)}if(d===3)return make('3 cuadernos cuestan '+(a*3)+'. 5 cuestan ?',a*5);return make('Área de rectángulo '+a+' × '+b+' = ?',a*b)}if(g===6){if(d===1){var pct=[10,20,25,50][rand(0,3)],base=rand(4,20)*10;return make(pct+'% de '+base+' = ?',base*pct/100)}if(d===2)return make('MCM de '+a+' y '+b+' = ?',lcm(a,b));if(d===3)return make((p+1)+'x = '+((p+1)*b)+' → x = ?',b);return make((p+1)+'x + '+a+' = '+(a+(p+1)*b)+' → x = ?',b)}if(g===7){if(d===1)return make('−'+a+' + '+b+' = ?',b-a);if(d===2)return make('2x + '+a+' = '+(a+b*2)+' → x = ?',b);if(d===3)return make('3(x − '+a+') = '+b*3+' → x = ?',a+b);return make('−2x + '+a+' = '+b+' → x = ?',(a-b)/2)}if(g===8){if(d===1)return make('2(x + '+a+') = '+b*2+' → x = ?',b-a);if(d===2)return make('x/2 + '+a+' = '+(a+b)+' → x = ?',2*b);if(d===3)return make('x² − '+a*a+' = 0. x positivo = ?',a);return make('Área de triángulo base '+a+' y altura '+b+' = ?',a*b/2)}if(g===9){if(d===1)return make('2^'+p+' × 2^'+q+' = ?',Math.pow(2,p+q));if(d===2)return make('√'+a*a+' = ?',a);if(d===3)return make('3x − '+a+' = '+b+' → x = ?',(a+b)/3);return make('f(x)=x²+'+a+'. f('+b+') = ?',b*b+a)}if(g===10){if(d===1)return make('Pendiente entre (0,0) y ('+a+','+b+') = ?',b/a);if(d===2)return make('x² − '+(a+b)+'x + '+a*b+' = 0. x menor = ?',Math.min(a,b));if(d===3){var sides=rand(4,10),fav=rand(1,sides-1);return make('Probabilidad de '+fav+' resultados favorables entre '+sides+' = ?',fav/sides)}return make('Distancia entre (0,0) y ('+a+','+b+') = ?',Math.sqrt(a*a+b*b))}if(d===1)return make('Derivada de x² en x='+a+' = ?',2*a);if(d===2)return make('∫ 2x dx evaluada en x='+a+' = ?',a*a);if(d===3)return make('Límite de (x²−'+a*a+')/(x−'+a+') en x='+a+' = ?',2*a);var den2=rand(2,6),fav2=rand(1,den2-1);return make('Probabilidad de '+fav2+' casos favorables entre '+den2+' = ?',fav2/den2)}function renderGrades()'''
          s,n=old_make.subn(new_make,s,1)
          if n!=1: raise SystemExit('makeQ replacement failed')

          insert_helpers='''function qKey(q){return String(q.text)+'|'+String(q.answer)}function uniqueQuestions(generator,count){var out=[],guard=0;while(out.length<count&&guard<count*500){var q=generator(),k=qKey(q);if(S.questionHistory.indexOf(k)<0){S.questionHistory.push(k);out.push(q)}guard++}return out}'''
          s=s.replace("function make(text,ans){",insert_helpers+"function make(text,ans){",1)
          s=s.replace("S.world=Array.isArray(S.world)?S.world:[];S.materials=Number(S.materials)||0;", "S.world=Array.isArray(S.world)?S.world:[];S.materials=Number(S.materials)||0;S.questionHistory=Array.isArray(S.questionHistory)?S.questionHistory:[];",1)

          s=s.replace("for(var i=0;i<20;i++)qs.push(makeQ(grade,Math.min(4,1+Math.floor((i+Math.floor((l-1)/2))/5))));", "qs=uniqueQuestions(function(){var i=qs.length;return makeQ(grade,Math.min(4,1+Math.floor((i+Math.floor((l-1)/2))/5)))} ,20);",1)
          s=s.replace("for(var i=0;i<10;i++)qs.push(makeQ(g,Math.min(4,1+Math.floor(i/3)+Math.floor((g-1)/4))));", "qs=uniqueQuestions(function(){var i=qs.length;return makeQ(g,Math.min(4,1+Math.floor(i/3)+Math.floor((g-1)/4)))} ,10);",1)
          s=s.replace("var d=Math.min(4,1+miniRound+Math.floor((grade-1)/3)),q=makeQ(grade,d);", "var d=Math.min(4,1+miniRound+Math.floor((grade-1)/3)),q=uniqueQuestions(function(){return makeQ(grade,d)},1)[0];",1)
          s=s.replace("var q=makeQ(grade,Math.min(4,1+Math.floor(bossQ/2)+Math.floor((grade-1)/3)));", "var q=uniqueQuestions(function(){return makeQ(grade,Math.min(4,1+Math.floor(bossQ/2)+Math.floor((grade-1)/3)))},1)[0];",1)

          s=s.replace("function startExploreLesson(){lessonPos=0;lessonScore=0;lessonQs=[];for(var i=0;i<5;i++)lessonQs.push(exploreQuestion(exploreGrade,exploreCat,exploreClass,exploreDiff));", "function startExploreLesson(){lessonPos=0;lessonScore=0;lessonQs=uniqueQuestions(function(){return exploreQuestion(exploreGrade,exploreCat,exploreClass,exploreDiff)},5);",1)

          puzzle_gen='''function nextPuzzle(){var g=rand(1,11),type=rand(1,6),a=rand(2,20+g*2),b=rand(1,8+g),text,ans;if(type===1){ans=a+b*2;text=a+', '+(a+b)+', '+(a+2*b)+', ¿?'}else if(type===2){ans=a*2;text=a+', '+(a*2)+', '+(a*4)+', ¿?'}else if(type===3){ans=a-b*2;text=a+', '+(a-b)+', '+(a-2*b)+', ¿?'}else if(type===4){ans=a*a;text='1, '+(2*2)+', '+(3*3)+', ..., '+a+'² = ?'}else if(type===5){ans=a+b;text='Si A='+a+' y B='+b+', A+B = ?'}else{ans=a*b;text='Rectángulo '+a+' × '+b+'. Área = ?'}return make(text,ans)}'''
          s=s.replace("function renderPuzzle(){var p=PUZZLES[puzzleIndex%PUZZLES.length];", puzzle_gen+"function renderPuzzle(){var p=uniqueQuestions(nextPuzzle,1)[0];",1)
          s=s.replace("var p=uniqueQuestions(nextPuzzle,1)[0];$('puzzleQuestion').textContent=p.text;", "var p=uniqueQuestions(nextPuzzle,1)[0];$('puzzleQuestion').textContent=p.text;",1)
          s=s.replace("var ok=Number(b.dataset.answer)===p[2];", "var ok=String(b.dataset.answer)===String(p.answer);",1)
          s=s.replace("'❌ La respuesta era '+p[2]", "'❌ La respuesta era '+p.answer",1)
          s=s.replace("$('puzzleOptions').innerHTML=p[1].map(function(v){return '<button class=\"answer puzzleOpt\" data-answer=\"'+v+'\">'+v+'</button>'}).join('');", "$('puzzleOptions').innerHTML=p.options.map(function(v){return '<button class=\"answer puzzleOpt\" data-answer=\"'+v+'\">'+v+'</button>'}).join('');",1)

          # Add quick/mental generators and wiring before theme handler.
          addon=r'''function renderQuickGrades(){var h='';for(var g=1;g<=11;g++){h+='<button class="grade" data-qgrade="'+g+'"><b>⚡ '+g+'° grado</b><span>Inicial · Intermedia · Avanzada · 12 retos</span></button>'}$('quickGradeGrid').innerHTML=h;document.querySelectorAll('[data-qgrade]').forEach(function(b){b.onclick=function(){startQuick(+b.dataset.qgrade)}})}function quickQuestion(g,d){var a=rand(2,10+g*2+d*3),b=rand(2,10+g+d*2),ans,text,type=rand(1,4);if(type===1){ans=a+b;text='Reto rápido: '+a+' + '+b+' = ?'}else if(type===2){ans=a*b;text='Reto rápido: '+a+' × '+b+' = ?'}else if(type===3){ans=a+3*b;text='Patrón: '+a+', '+(a+b)+', '+(a+2*b)+', ?'}else{ans=a*b+g;text='Problema exprés: '+a+' grupos de '+b+' y '+g+' extra. ¿Total?'}return make(text,ans)}var quickGrade=1,quickDiff=1,quickPos=0,quickScore=0,quickQs=[];function startQuick(g){quickGrade=g;quickDiff=1;var pick=prompt('Elige dificultad: 1 Inicial, 2 Intermedia, 3 Avanzada','1');quickDiff=Math.max(1,Math.min(3,Number(pick)||1));quickPos=0;quickScore=0;quickQs=uniqueQuestions(function(){return quickQuestion(quickGrade,quickDiff)},12);$('quickTitle').textContent='⚡ Reto rápido · '+g+'° · '+DIFF[quickDiff-1][0];$('quickInfo').textContent='12 preguntas únicas · dificultad adaptada';show('quickGame');renderQuickQuestion()}function renderQuickQuestion(){if(quickPos>=quickQs.length){S.xp+=quickScore*(8+quickGrade);S.coins+=quickScore*2;save();return celebrate('⚡ Reto rápido terminado','Aciertos: '+quickScore+'/12.','explore')}var q=quickQs[quickPos];$('quickProgress').textContent='Pregunta '+(quickPos+1)+' de 12';$('quickMeter').style.width=(quickPos/12*100)+'%';$('quickQuestion').textContent=q.text;$('quickFeedback').textContent='';$('quickNext').style.display='none';$('quickOptions').innerHTML=q.options.map(function(v){return '<button class="answer quickOpt" data-answer="'+v+'">'+v+'</button>'}).join('');document.querySelectorAll('.quickOpt').forEach(function(b){b.onclick=function(){document.querySelectorAll('.quickOpt').forEach(function(x){x.disabled=true});if(String(b.dataset.answer)===q.answer){quickScore++;S.xp+=5+quickGrade;S.coins++;$('quickFeedback').textContent='✅ Correcto'}else $('quickFeedback').textContent='❌ Era '+q.answer;save();$('quickNext').style.display='block';$('quickNext').textContent=quickPos===11?'🏁 Resultado':'➡️ Siguiente'}})}var mentalGrade=1,mentalDiff=1,mentalSeq=[],mentalAnswer=0,mentalBusy=false;function renderMentalGrades(){var h='';for(var g=1;g<=11;g++){h+='<button class="grade" data-mgrade="'+g+'"><b>🧠 '+g+'° grado</b><span>Series rápidas · 3 dificultades</span></button>'}$('mentalGradeGrid').innerHTML=h;document.querySelectorAll('[data-mgrade]').forEach(function(b){b.onclick=function(){mentalGrade=+b.dataset.mgrade;var pick=prompt('Elige dificultad: 1 Inicial, 2 Intermedia, 3 Avanzada','1');mentalDiff=Math.max(1,Math.min(3,Number(pick)||1));startMental()}})}function startMental(){var count=Math.min(3+Math.floor((mentalGrade-1)/3)+mentalDiff,8),max=mentalGrade<=2?9+mentalGrade*3:20+mentalGrade*8,seq=[],guard=0;while(seq.length<count&&guard<100){var n=rand(1,max);if(seq.indexOf(n)<0)seq.push(n);guard++}mentalSeq=seq;mentalAnswer=seq.reduce(function(a,b){return a+b},0);var key='MENTAL|'+mentalGrade+'|'+mentalDiff+'|'+seq.join(',');if(S.questionHistory.indexOf(key)>=0)return startMental();S.questionHistory.push(key);save();$('mentalTitle').textContent='🧠 Cálculo mental · '+mentalGrade+'° · '+DIFF[mentalDiff-1][0];$('mentalInfo').textContent='Memoriza la serie y calcula su suma.';$('mentalStatus').textContent='Prepárate...';$('mentalSequence').textContent='';$('mentalQuestion').style.display='none';$('mentalAnswer').style.display='none';$('mentalCheck').style.display='none';$('mentalStart').style.display='none';$('mentalFeedback').textContent='';var i=0;mentalBusy=true;function flash(){if(i>=seq.length){mentalBusy=false;$('mentalSequence').textContent='?';$('mentalStatus').textContent='Ahora calcula la suma';$('mentalQuestion').style.display='block';$('mentalQuestion').textContent='¿Cuál es el resultado de la serie?';$('mentalAnswer').style.display='block';$('mentalCheck').style.display='inline-block';$('mentalAnswer').focus();return}$('mentalSequence').textContent=seq[i];$('mentalStatus').textContent='Número '+(i+1)+' de '+seq.length; i++;setTimeout(flash,Math.max(350,900-mentalDiff*150-mentalGrade*20))}flash()}function checkMental(){if(mentalBusy)return;var v=Number($('mentalAnswer').value);if(v===mentalAnswer){S.xp+=15+mentalGrade*3;S.coins+=3;S.streak++;$('mentalFeedback').textContent='✅ ¡Excelente! Resultado correcto: '+mentalAnswer}else{S.streak=0;$('mentalFeedback').textContent='❌ El resultado era '+mentalAnswer}save();$('mentalCheck').style.display='none';$('mentalStart').style.display='inline-block';$('mentalStart').textContent='🔁 Nueva serie'}'''
          s=s.replace("$('themeBtn').onclick=",addon+"$('themeBtn').onclick=",1)

          # Wire category routing and new controls.
          wire="document.querySelectorAll('.category-card').forEach(function(b){b.onclick=function(){exploreCat=b.dataset.category;if(exploreCat==='quick'){renderQuickGrades();show('quickChallenges')}else if(exploreCat==='mental'){renderMentalGrades();show('mental')}else{exploreGrades(exploreCat)}}});"
          s=s.replace("document.querySelectorAll('.category-card').forEach(function(b){b.onclick=function(){exploreCat=b.dataset.category;exploreGrades(exploreCat)}});",wire,1)
          s=s.replace("$('backExploreGrades').onclick=function(){show('explore')};", "$('backExploreGrades').onclick=function(){show('explore')};$('backQuick').onclick=function(){show('explore')};$('backQuickGame').onclick=function(){renderQuickGrades();show('quickChallenges')};$('quickNext').onclick=function(){if(quickPos===11){S.xp+=quickScore*4;save();celebrate('⚡ Reto rápido terminado','Aciertos: '+quickScore+'/12.','quickChallenges')}else{quickPos++;renderQuickQuestion()}};$('backMental').onclick=function(){show('explore')};$('backMentalGame').onclick=function(){renderMentalGrades();show('mental')};$('mentalStart').onclick=function(){startMental()};$('mentalCheck').onclick=function(){checkMental()};",1)

          # Keep legacy puzzle array but make dynamic renderer authoritative.
          s=s.replace("var PUZZLES=[", "var PUZZLES=[",1)
          s=s.replace("$('puzzleQuestion').textContent=p.text;", "$('puzzleQuestion').textContent=p.text;",1)

          # Mark patched version invisibly for idempotence.
          s=s.replace('</body>', '<span data-patch="v2-unique-quick-mental" aria-hidden="true"></span></body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched app and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir preguntas repetidas y agregar retos rapidos y calculo mental"
          git rm .github/workflows/patch-app.yml
          git commit -m "Retirar parche de una sola ejecucion"
          git push